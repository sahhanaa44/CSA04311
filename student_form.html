<!DOCTYPE html>
<html>
<head>
<title>student information survey</title>
</head>
<body>
<h2><i><u>student information survey</u></i></h2>
<form>
name:
<input type="text" name="name">
<br><br>
register number:
<input type="text" name="regno">
<br><br>
gender:
<input type="radio" name="gender">male
<input type="radio" name="gender">female
<br><br>
department:
<select>
<option>CSE</option>
<option>IT</option>
<option>ECE</option>
<option>EEE</option>
<option>MECH</option>
</select>
<br></br>
hobbies:
<input type="checkbox">sports
<input type="checkbox">music
<input type="checkbox">movies
<input type="checkbox">dancing
<br><br>
email:
<input type="email" name="email">
<br><br>
<input type="submit" value="submit">
<input type="reset" value="reset">
</form>
</body>
</html>
